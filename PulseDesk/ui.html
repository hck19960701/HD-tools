      ${num("deep_scan_minutes","完整覆查間隔（分鐘）","補回 Outlook 離線後才同步的郵件，建議 120")}
    </div></div>
    <div class="card form" style="margin-top:12px"><h3>掃描的資料夾</h3>
      <div class="hint">預設只掃描你自己信箱（${esc(S.data.health.outlook_user||"預設信箱")}）的收件匣${c.scan_sent_items?"及寄件備份":""}。需要監控共用信箱時才勾選其他資料夾。</div>
      <div id="folderPick">${folderPickHtml("scan")}</div>
      <div class="row" style="margin-top:12px;gap:18px">${chk("include_subfolders","同時掃描所選資料夾的子資料夾")}${chk("scan_sent_items","使用預設時包括寄件備份（偵測直接用 Outlook 回覆客戶）")}</div></div>
    <div class="card form" style="margin-top:12px"><h3>Outlook 分類</h3><div class="hint">取消勾選的分類不會在「Outlook 分類」頁顯示</div>
      <div class="row" style="gap:14px" id="s-cats">${(S.data.categories.master||[]).map(m=>`<label class="chk"><input type="checkbox" data-cat="${esc(m.name)}" ${(c.hidden_categories||[]).includes(m.name)?"":"checked"}><span class="mini-cat"><i style="background:${m.color}"></i>${esc(m.name)}</span></label>`).join("") || `<span class="meta">未讀取到 Outlook 分類</span>`}</div>
      <h4 style="margin:16px 0 6px;font-size:14px">讀取分類的資料夾</h4>
      <div class="hint" style="margin-bottom:8px">預設讀取收件匣及其子資料夾，但不包括超過 5,000 封的大資料夾（例如 Alerts、Mailbox Archive），以免 Outlook 變慢。</div>
      <div id="catFolderPick">${folderPickHtml("cat")}</div>
      <div class="fgrid" style="margin-top:12px">${num("category_refresh_minutes","分類完整更新間隔（分鐘）","你改分類時會即時更新；這只是後備，建議 15")}</div></div>
    <div class="card form" style="margin-top:12px"><h3>同事名單及簽名</h3>
      <div class="hint">用於分派及辨認誰回覆了客戶。<b>用 support@ / servicedesk@ 回覆</b>時按「簽名」辨認（簽名要獨立成行，多行簽名請分行輸入，例如 Thanks 換行 Regards）；<b>用自己信箱回覆</b>時按電郵或名稱辨認，不看簽名。填寫電郵後，分派時亦可開啟 Outlook 通知草稿。</div>
      <div class="col-head"><span>名稱</span><span>自己的電郵（可選）</span><span>使用 support@ / servicedesk@ 時的簽名</span><span></span></div>
      <div id="colRows">${c.colleagues.map(colRow).join("")}</div>
      <button class="btn sm" onclick="addCol()">＋ 加入同事</button>
      <h4 style="margin:18px 0 4px;font-size:14px">測試簽名辨認</h4>
      <div class="meta" style="margin:0">貼上一封用 support@ / servicedesk@ 寄出的回覆內容（包括下面引用的舊郵件亦可），看看 PulseDesk 會認為是誰回覆。使用已儲存的設定。</div>
      <div class="sig-test"><textarea class="inp" id="sigText" rows="5" placeholder="Hi Iyrus&#10;&#10;We will check and get back to you&#10;&#10;Thank you"></textarea>
        <div><input class="inp" id="sigSender" style="width:100%" placeholder="寄件人電郵（留空 = support@）"><button class="btn sm primary" id="sigTestBtn" style="margin-top:8px" onclick="testSig()">測試</button></div></div>
      <div id="sigRes"></div></div>
    <div class="card form" style="margin-top:12px"><h3>提醒</h3><div class="hint">工單到達警告、緊急及超時的時候</div>
      <div class="row" style="gap:18px">${chk("sound","播放提示聲")}${chk("desktop_popup","PulseDesk 視窗關閉時，用 Windows 彈出視窗提醒")}</div>
      <div class="row" style="margin-top:12px"><button class="btn sm" onclick="askNotif()">🔔 啟用桌面通知</button><button class="btn sm" onclick="testAlert()">測試提醒</button></div></div>
    <div class="save-bar"><button class="btn" onclick="renderSettings()">還原</button><button class="btn primary" onclick="saveSettings()">儲存設定</button></div>`;
  checkDupSig();
}
function folderDefaults(kind){
  const c = cfg(), fl = S.folderList||[];
  if(kind==="scan") return fl.filter(f=>f.default && (f.kind==="inbox" || (f.kind==="sent" && c.scan_sent_items))).map(f=>f.path);
  return (S.data.health.cat_folders||[]);
}
function folderPickHtml(kind){
  const c = cfg(), sel = (kind==="scan" ? c.scan_folders : c.category_folders)||[];
  if(!S.folderList){
    const cur = sel.length ? sel.map(esc).join("、") : kind==="scan"
      ? "預設（自己信箱的收件匣"+(c.scan_sent_items?"及寄件備份":"")+"）"
      : "預設（" + ((S.data.health.cat_folders||[]).length || "—") + " 個資料夾）";
    return `<div class="row"><span class="meta" style="margin:0">目前：${cur}</span><button class="btn sm" onclick="loadFolders()">選擇資料夾…</button></div>`;
  }
  const defs = folderDefaults(kind);
  const isChecked = f => sel.length ? sel.includes(f.path) : defs.includes(f.path);
  const list = S.folderList.filter(f => kind==="scan" ? f.kind!=="task" : f.kind!=="sent");
  const stores = [...new Set(list.map(f=>f.store))];
  const attr = kind==="scan" ? "data-fp" : "data-cf";
  const icon = f => f.kind==="sent"?"📤":f.kind==="inbox"?"📥":f.kind==="task"?"✅":"📁";
  return stores.map(st=>{ const fs = list.filter(f=>f.store===st); const def = fs[0] && fs[0].default;
    return `<div class="blk" style="margin-bottom:10px"><h4 style="margin-bottom:6px">${esc(st)}${def?' <span class="pill blue">你的信箱</span>':''}</h4>
      ${fs.map(f=>`<label class="chk" style="padding:3px 0 3px ${f.depth*22}px"><input type="checkbox" ${attr}="${esc(f.path)}" ${isChecked(f)?"checked":""}> ${icon(f)} ${esc(f.name)}
        ${f.count>=0?`<span class="meta" style="margin:0">（${Number(f.count).toLocaleString()}）</span>`:""}${f.kind==="sent"?' <span class="meta" style="margin:0">寄件備份</span>':''}
        ${kind==="cat"&&f.kind==="sub"&&f.count>5000?'<span class="pill amber">大資料夾，讀取分類會令 Outlook 變慢</span>':''}</label>`).join("")}</div>`; }).join("")
    + `<div class="meta">勾選後按「儲存設定」。</div>`;
}
async function loadFolders(){
  $("#folderPick").innerHTML = $("#catFolderPick").innerHTML = `<span class="meta">正在讀取 Outlook 資料夾…</span>`;
  try{ const r = await api("/api/folders"); S.folderList = r.folders; }
  catch(e){ toast("未能讀取資料夾", e.message, "bad"); }
  $("#folderPick").innerHTML = folderPickHtml("scan");
  $("#catFolderPick").innerHTML = folderPickHtml("cat");
}
function pickedFolders(kind){
  const attr = kind==="scan" ? "data-fp" : "data-cf";
  const picked = [...document.querySelectorAll(`[${attr}]`)].filter(x=>x.checked).map(x=>x.getAttribute(attr));
  const defs = folderDefaults(kind);
  const same = picked.length===defs.length && picked.every(p=>defs.includes(p));
  return same ? [] : picked;      // 與預設相同就保存為「預設」
}
const colRow = x => `<div class="col-row"><input class="inp" placeholder="名稱，例如 Sai Ho" value="${esc(x.name)}" oninput="checkDupSig()"><input class="inp" placeholder="例如 sho@premier-technology.com" value="${esc(x.email||"")}"><textarea class="inp" placeholder="例如 Thank you" oninput="checkDupSig()">${esc(x.signature||"")}</textarea><button class="btn sm danger" onclick="this.parentElement.remove();checkDupSig()">移除</button></div>`;
const sigKey = v => String(v||"").split(/\n+/).map(l=>l.replace(/\u00a0/g," ").trim().toLowerCase().replace(/\s+/g," ").replace(/ and /g," & ").replace(/^[\s,.!;:，。！；：\-–—~*_]+|[\s,.!;:，。！；：\-–—~*_]+$/g,"")).filter(Boolean).join("\n");
function checkDupSig(){
  const rows = [...document.querySelectorAll("#colRows .col-row")];
  const seen = {};
  rows.forEach(r=>{ const k = sigKey(r.querySelector("textarea").value); const nm = r.querySelector("input").value.trim(); if(k) (seen[k] ||= []).push(nm); });
  rows.forEach(r=>{ r.querySelectorAll(".dup").forEach(x=>x.remove());
    const k = sigKey(r.querySelector("textarea").value); const others = k ? seen[k].filter(n=>n!==r.querySelector("input").value.trim()) : [];
    if(others.length) r.insertAdjacentHTML("beforeend", `<div class="dup"><span class="pill amber">簽名與 ${esc(others.join("、"))} 相同，用 support@ 回覆時會未能確定是誰</span></div>`); });
}
async function testSig(){
  try{ const r = await api("/api/test_signature",{text:$("#sigText").value, sender:$("#sigSender").value});
    $("#sigRes").innerHTML = `<div class="sig-res">${r.replier?`辨認為 <b>${esc(r.replier)}</b>`:"<b>未能辨認</b>"}　<span class="meta" style="margin:0">${esc(r.how)} · 新回覆部分共 ${r.reply_lines} 行</span></div>`; }
  catch(e){ toast("測試失敗", e.message, "bad"); }
}
function addCol(){ $("#colRows").insertAdjacentHTML("beforeend", colRow({name:"",email:""})); $("#colRows").lastElementChild.querySelector("input").focus(); }
async function saveSettings(){
  const body = {};
  document.querySelectorAll("#page-settings [data-k]").forEach(el=>{ body[el.dataset.k] = el.type==="checkbox" ? el.checked : el.value; });
  body.internal_domains = $("#s-dom").value.split(/[,\s]+/).filter(Boolean);
  body.support_addresses = $("#s-sup").value.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  if(S.folderList){ body.scan_folders = pickedFolders("scan"); body.category_folders = pickedFolders("cat"); }
  body.freshdesk_url = $("#s-fd").value;
  body.ignore_senders = $("#s-igs").value.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  body.ignore_subjects = $("#s-igj").value.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const catBoxes = [...document.querySelectorAll("#s-cats [data-cat]")];
  if(catBoxes.length) body.hidden_categories = catBoxes.filter(x=>!x.checked).map(x=>x.dataset.cat);
  body.colleagues = [...document.querySelectorAll("#colRows .col-row")].map(r=>{ const i=r.querySelectorAll("input"); return {name:i[0].value.trim(), email:i[1].value.trim(), signature:r.querySelector("textarea").value}; }).filter(x=>x.name);
  try{ const r = await api("/api/config", body); S.data.config = r.config; renderSettings(); renderChrome(); toast("設定已儲存","","ok"); }
  catch(e){ toast("未能儲存", e.message, "bad"); }
}

/* ================= 提醒 ================= */
let AC = null;
try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
function unlockAudio(){ if(AC && AC.state==="suspended") AC.resume().then(renderChrome); }
document.addEventListener("pointerdown", ()=>{ if(AC && AC.state==="suspended") AC.resume().then(renderChrome); }, true);
function beep(level){
  if(!AC || S.mute || !cfg().sound) return;
  const pattern = level>=3 ? [880,0,880,0,880,0,1175] : level===2 ? [740,0,988] : [660];
  let t = AC.currentTime + 0.02;
  pattern.forEach(f=>{ if(f){ const o=AC.createOscillator(), g=AC.createGain(); o.type="sine"; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t+0.2); } t += 0.2; });
}
function notify(title, body, level, id){
  if(!("Notification" in window) || Notification.permission!=="granted") return;
  try{ const nt = new Notification(title,{body, tag:"pd-"+(id||"x")+"-"+level, requireInteraction:level>=2, silent:true});
    nt.onclick = () => { window.focus(); if(id){ go("board"); openDrawer(id); } nt.close(); }; }catch(e){}
}
function askNotif(){ if(!("Notification" in window)) return toast("此瀏覽器不支援通知","","warn");
  Notification.requestPermission().then(p=>{ renderChrome(); toast(p==="granted"?"已啟用桌面通知":"未能啟用通知", p==="granted"?"":"請在瀏覽器網址列左邊的設定允許通知", p==="granted"?"ok":"warn"); }); }
function checkAlerts(){
  if(!S.data) return;
  const c = cfg(), reply = tickets().filter(t=>t.phase==="reply");
  const fresh = [];
  reply.forEach(t=>{ const prev = S.alerted[t.id]||0; if(t.level>prev){ S.alerted[t.id]=t.level; fresh.push(t); } });
  // 新工單（0 級）也提醒一次
  reply.forEach(t=>{ if(!(t.id in S.alerted)){ S.alerted[t.id]=0; if(!S.firstLoad) fresh.push(t); } });
  if(!fresh.length) return;
  if(S.firstLoad){
    const hot = fresh.filter(t=>t.level>=1);
    if(hot.length){ const lv = Math.max(...hot.map(t=>t.level));
      toast(`${hot.length} 張工單需要盡快回覆`, hot.slice(0,3).map(t=>"#"+t.id+" "+(t.company||"")).join("、"), lv>=3?"bad":"warn");
      notify(`PulseDesk：${hot.length} 張工單需要盡快回覆`, hot.slice(0,3).map(t=>"#"+t.id+" "+t.subject).join("\n"), lv, null); beep(lv); }
    return;
  }
  const top = Math.max(...fresh.map(t=>t.level));
  fresh.sort((a,b)=>b.level-a.level).slice(0,3).forEach(t=>{
    const mins = Math.floor(t.elapsedSec/60);
    const L = t.mail ? "客戶郵件" : "#"+t.id;
    const title = t.level===0 ? (t.mail ? `新客戶郵件：${t.requester||t.requester_email||""}` : `新工單 #${t.id}`)
      : t.level===3 ? `已超時！${L} 未首次回覆` : `${L} 已等 ${mins} 分鐘`;
    const body = [t.company||t.requester, t.subject].filter(Boolean).join(" — ");
    toast(title, body, t.level===3?"bad":t.level>=1?"warn":"", t.id);
    notify(title, body + (t.level? `\n剩餘 ${Math.max(0,c.sla_minutes-mins)} 分鐘`:""), t.level, t.id);
  });
  beep(top===0 ? 1 : top);
}
setInterval(()=>{ // 已超時的工單每分鐘再響一次
  if(!S.data) return; const b = tickets().filter(t=>t.phase==="reply" && t.level===3);
  if(b.length) beep(3);
}, 60000);
function testAlert(){ beep(2); toast("測試提醒","如果你聽到聲音及看到這個通知，提醒功能正常。","warn"); notify("PulseDesk 測試提醒","提醒功能正常 ✓",1,null); }

function toast(title, body="", kind="", id=null){
  const el = document.createElement("div"); el.className = "toast "+kind;
  el.innerHTML = `<div style="flex:1;${id?"cursor:pointer":""}"><b>${esc(title)}</b>${body?`<div style="opacity:.85;font-size:13px;margin-top:2px">${esc(body)}</div>`:""}</div><button title="關閉">✕</button>`;
  el.querySelector("button").onclick = () => el.remove();
  if(id) el.firstElementChild.onclick = () => { go("board"); openDrawer(id); el.remove(); };
  $("#toasts").appendChild(el);
  setTimeout(()=>el.remove(), kind==="bad" ? 20000 : 8000);
  while($("#toasts").children.length>5) $("#toasts").firstElementChild.remove();
}

/* ================= 導航與啟動 ================= */
const RENDER = {board:renderBoard, list:renderList, cats:renderCats, stats:renderStats, health:renderHealth, settings:renderSettings};
function go(page){
  S.page = page;
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on", b.dataset.page===page));
  document.querySelectorAll(".page").forEach(p=>p.classList.toggle("on", p.id==="page-"+page));
  const [e,t,s] = PAGES[page]; $("#eyebrow").textContent=e; $("#pageTitle").textContent=t;
  $("#pageSub").textContent = page==="board" ? `客戶郵件須在 ${cfg().sla_minutes} 分鐘內首次回覆，然後分派同事跟進` : s;
  if(S.data) { RENDER[page](); renderChrome(); }
  $("#main").scrollTop = 0;
}
async function doSync(full){
  const b = $("#syncBtn");
  if(b.disabled) return;
  b.disabled = true; b.textContent = "⟳ 同步中…";
  const done = () => { b.disabled = false; b.textContent = "⟳ 立即同步"; };
  let r;
  try{ r = await api("/api/sync",{full:!!full}); }
  catch(e){ toast("同步失敗", e.message, "bad"); return done(); }
  if(full){ toast("已開始完整重新掃描","會在背景進行，期間新郵件仍會即時處理"); await refresh(); return done(); }
  if(r.busy){ toast(`正在進行${r.busy}`,"完成後會立即再檢查新郵件；期間新郵件仍會即時處理"); await refresh(); return done(); }
  if(S.data && S.data.health.mode==="demo"){ await refresh(); toast("已同步","示範模式","ok"); return done(); }
  // 等待這次同步完成（通常 1 秒內）
  const t0 = Date.now();
  while(Date.now() - t0 < 15000){
    await new Promise(res=>setTimeout(res, 500));
    await refresh();
    const h = S.data && S.data.health;
    if(h && (h.scans||0) > (r.scans||0) && !h.running){
      toast("已同步", `找到 ${h.scanned||0} 封新郵件（${h.new_events||0} 封與工單有關），用時 ${h.duration??"—"} 秒`, "ok");
      return done();
    }
  }
  toast("同步仍在進行","Outlook 可能正忙，完成後畫面會自動更新","warn");
  done();
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.page));
$("#syncBtn").onclick = () => doSync(false);
$("#muteBtn").onclick = () => { S.mute=!S.mute; try{ localStorage.setItem("pd-mute", S.mute?"1":"0"); }catch(e){} renderChrome(); toast(S.mute?"已靜音":"已開啟提示聲"); if(!S.mute){ unlockAudio(); beep(1);} };
$("#notifBtn").onclick = askNotif;
$("#scrim").onclick = closeDrawer;
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeDrawer(); });
$("#quitBtn").onclick = async () => {
  if(!confirm("結束 PulseDesk？\n結束後將不會再監控 Outlook 郵件，也不會有超時提醒。")) return;
  try{ await api("/api/shutdown",{}); }catch(e){}
  document.body.innerHTML = `<div style="margin:auto;text-align:center;color:#334155"><h2>PulseDesk 已結束</h2><p>可以關閉這個視窗。需要時再雙擊 PulseDesk 打開。</p></div>`;
};

refresh();
setInterval(refresh, 3000);
setInterval(tick, 1000);
tick();
</script>
